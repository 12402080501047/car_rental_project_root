{% extends 'rentals/base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-10 rounded-xl shadow-xl border border-gray-200">
    <h2 class="text-3xl font-bold text-center text-slate-800 mb-8">Create an Account</h2>
    <form method="post" class="space-y-5">
        {% csrf_token %}

        {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-1">{{ field.label }}</label>
                <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" id="{{ field.id_for_label }}"
                       class="w-full" placeholder="Enter {{ field.label|lower }}" {% if field.value and field.field.widget.input_type != 'password' %}value="{{ field.value }}"{% endif %} {% if field.field.required %}required{% endif %}>
                {% for error in field.errors %}
                    <p class="text-red-600 text-xs mt-1">{{ error }}</p>
                {% endfor %}
            </div>
        {% endfor %}

        <button type="submit" class="w-full flex justify-center py-3 px-6 border border-transparent rounded-lg shadow-md text-base font-semibold text-white bg-primary-blue hover:bg-secondary-orange transition-all transform hover:-translate-y-1">Register</button>
    </form>
    <p class="mt-8 text-center text-slate-600 text-sm">
        Already have an account? <a href="{% url 'login' %}" class="font-semibold text-primary-blue hover:underline">Log in here</a>
    </p>
</div>
{% endblock %}
