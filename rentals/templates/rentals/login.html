{% extends 'rentals/base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-10 rounded-xl shadow-xl border border-gray-200">
    <h2 class="text-3xl font-bold text-center text-slate-800 mb-8">Login to Your Account</h2>
    <form method="post" class="space-y-6">
        {% csrf_token %}

        {% if form.non_field_errors %}
            <div class="bg-red-100 border border-red-300 text-red-700 px-4 py-3 rounded-lg">
                {% for error in form.non_field_errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <div>
            <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-1">Username or Email</label>
            <input type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}"
                   class="w-full" placeholder="Enter your username or email">
        </div>

        <div>
            <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
            <input type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}"
                   class="w-full" placeholder="Enter your password">
        </div>

        <button type="submit" class="w-full flex justify-center py-3 px-6 border border-transparent rounded-lg shadow-md text-base font-semibold text-white bg-primary-blue hover:bg-secondary-orange transition-all transform hover:-translate-y-1">Login</button>
    </form>
    <p class="mt-8 text-center text-slate-600 text-sm">
        Don't have an account? <a href="{% url 'register' %}" class="font-semibold text-primary-blue hover:underline">Register here</a>
    </p>
</div>
{% endblock %}
