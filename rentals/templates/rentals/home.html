{% extends 'rentals/base.html' %}

{% block content %}
<div class="text-center py-24 px-8 bg-white rounded-xl shadow-2xl" style="background-image: linear-gradient(rgba(255,255,255,0.85), rgba(255,255,255,0.85)), url('https://images.unsplash.com/photo-1517524206127-48bbd363f357?q=80&w=2070'); background-size: cover; background-position: center;">
    <h1 class="text-5xl md:text-6xl font-extrabold text-slate-800 leading-tight">Your Journey, Our Chariot</h1>
    <p class="text-xl text-slate-600 mt-6 max-w-3xl mx-auto">Find the perfect car for your next adventure. Reliable, simple, and ready for the road.</p>
</div>

<div class="max-w-4xl mx-auto bg-white p-10 rounded-xl shadow-xl -mt-20 relative z-10 border border-gray-200">
    <h2 class="text-3xl font-bold text-center text-slate-800 mb-8">Find Your Ride</h2>

    <form id="search-form" action="{% url 'car_list' %}" method="get" class="grid grid-cols-1 md:grid-cols-3 gap-7 items-end">
        <div>
            <label for="{{ form.start_date.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-1">Start Date</label>
            {{ form.start_date }}
        </div>
        <div>
            <label for="{{ form.end_date.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-1">End Date</label>
            {{ form.end_date }}
        </div>
        <div>
            <label for="{{ form.capacity.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-1">{{ form.capacity.label }}</label>
            {{ form.capacity }}
        </div>
        <button type="submit" class="md:col-span-3 w-full bg-primary-blue text-white py-3 px-6 rounded-lg hover:bg-secondary-orange font-semibold text-lg transition-all duration-200 transform hover:-translate-y-1 shadow-md">Search Cars</button>
    </form>
</div>

<script>
    const searchForm = document.getElementById('search-form');
    searchForm.addEventListener('submit', function(event) {
        const startDateValue = document.getElementById('{{ form.start_date.id_for_label }}').value;
        const endDateValue = document.getElementById('{{ form.end_date.id_for_label }}').value;

        if (!startDateValue || !endDateValue) {
            event.preventDefault();
            alert('Please select both a start and end date.');
            return;
        }

        const startDate = new Date(startDateValue);
        const endDate = new Date(endDateValue);

        if (endDate <= startDate) {
            event.preventDefault();
            alert('End date must be after the start date. Please select proper dates.');
        }
    });
</script>
<style>
    input[type="date"], input[type="number"] {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #cbd5e1;
        border-radius: 0.5rem;
        margin-top: 0.25rem;
        background-color: #f8fafc;
    }
</style>
{% endblock %}
